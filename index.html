<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Golf ball flight simulator with a calibrated physics engine." />
    <title>Ballflight Simulator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23006747'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f4d35e'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Franklin:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="app">
      <header class="masthead">
        <div class="wordmark">
          <span class="wordmark-title">Ballflight</span>
          <span class="wordmark-sub">Ball Flight Laboratory</span>
        </div>
        <nav class="app-nav" aria-label="Ballflight">
          <a href="./index.html" aria-current="page">Simulator</a>
          <a href="./game.html">Course</a>
        </nav>
        <div class="segmented" role="group" aria-label="Units">
          <button type="button" id="units-imperial" data-units="imperial" aria-pressed="true">Yards</button>
          <button type="button" id="units-metric" data-units="metric" aria-pressed="false">Metres</button>
        </div>
      </header>

      <aside id="controls" aria-label="Shot settings">
        <section class="library" id="library" aria-label="Your shots"></section>
        <h2 class="section-head">Shot</h2>
        <label class="field">
          <span>Tour average</span>
          <select id="preset"></select>
        </label>
        <label class="field">
          <span>Landing on</span>
          <select id="surface"></select>
        </label>
        <div id="params"></div>
        <button type="button" id="find-ace" class="wide-button">Find a hole-in-one</button>
        <p class="library-name" id="ace-status" aria-live="polite"></p>
      </aside>

      <main id="vis">
        <section class="course" aria-label="3D view of the shot">
          <canvas id="course-cv"></canvas>
          <div class="course-bar">
            <div class="course-title">The Range<span id="course-phase">Ready</span></div>
            <div class="course-tools">
              <div class="cameras" role="group" aria-label="Camera">
                <button type="button" id="cam-tee" data-camera="tee" aria-pressed="true">Tee</button>
                <button type="button" id="cam-swing" data-camera="swing" aria-pressed="false">Swing</button>
                <button type="button" id="cam-follow" data-camera="follow" aria-pressed="false">Follow</button>
                <button type="button" id="cam-side" data-camera="side" aria-pressed="false">Side</button>
                <button type="button" id="cam-above" data-camera="above" aria-pressed="false">Above</button>
              </div>
              <div class="cameras" role="group" aria-label="Playback and layers">
                <button type="button" id="layer-forces" aria-pressed="true">Forces</button>
                <button type="button" id="layer-ghost" aria-pressed="true">Standard</button>
                <button type="button" id="layer-tour" aria-pressed="true">Tour</button>
                <button type="button" id="layer-trails" aria-pressed="false">Trails</button>
                <label class="speed">
                  <span class="visually-hidden">Playback speed</span>
                  <select id="speed">
                    <option value="0.1">0.1x</option>
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1x</option>
                    <option value="2">2x</option>
                  </select>
                </label>
                <button type="button" id="hit" class="hit">Hit</button>
              </div>
            </div>
          </div>
          <div class="pip" id="pip-legend"></div>
          <p class="fly-hint">Drag to orbit · W A S D to fly · Q / E down and up · Shift for speed</p>
        </section>

        <div class="charts">
          <div class="screen" id="side-wrap">
            <canvas id="side-cv" role="img" aria-label="Side view of the shot"></canvas>
          </div>
          <div class="screen" id="top-wrap">
            <canvas id="top-cv" role="img" aria-label="Top view of the shot"></canvas>
          </div>
        </div>

        <section class="board" aria-label="Shot results">
          <div class="board-head">
            <h2>Leaderboard</h2>
            <span class="board-sub" id="board-sub"></span>
          </div>
          <div class="board-scroll">
            <table id="board"></table>
          </div>
        </section>
      </main>
    </div>
    <dialog id="shot-dialog" class="shot-dialog" aria-label="Review your shots"></dialog>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
