<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golf Ball Physics Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Design Tokens ────────────────────────────────────────────
       Palette: deep navy ink, precision-tracking teal, warm trajectory
       This is a deliberate single-theme design (launch monitors are
       always dark — the darkroom is part of the aesthetic contract).
    ──────────────────────────────────────────────────────────────── */
    :root {
      --ink-950:  #07111f;   /* deepest bg                    */
      --ink-900:  #09172a;   /* page background               */
      --ink-800:  #0f1f38;   /* panel / sidebar               */
      --ink-700:  #162844;   /* input surfaces                */
      --ink-600:  #1e3858;   /* borders                       */
      --ink-500:  #2a4f78;   /* subtle borders, hover         */

      --text-100: #c8ddf0;   /* primary text                  */
      --text-300: #5a7a98;   /* muted / labels                */
      --text-400: #3a567a;   /* very muted                    */

      --teal:     #0dd8b2;   /* tracking-teal accent          */
      --teal-dim: rgba(13, 216, 178, 0.12);
      --teal-glow:rgba(13, 216, 178, 0.06);

      /* trajectory gradient (warm arc against cold sky) */
      --traj-start: #f8c43a;  /* gold at launch   */
      --traj-mid:   #f07040;  /* amber mid-flight */
      --traj-end:   #e04545;  /* crimson at land  */

      --apex-color: #f8c43a;
      --land-color: #e04545;
      --launch-color: #0dd8b2;
      --ground-color: #1a9e7a;

      --mono: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', 'Consolas',
              'SF Mono', monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

      /* canvas grid / axis colors */
      --canvas-bg:   #06101d;
      --grid-line:   #0f2035;
      --grid-bright: #162d4a;
      --axis-text:   #3a567a;
    }

    body {
      background: var(--ink-900);
      color: var(--text-100);
      font-family: var(--sans);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── App Shell ─────────────────────────────────────────────── */
    #app {
      display: flex;
      height: 100vh;
    }

    /* ─── Sidebar ───────────────────────────────────────────────── */
    #controls {
      width: 268px;
      min-width: 240px;
      overflow-y: auto;
      padding: 18px 14px 22px;
      background: var(--ink-800);
      border-right: 1px solid var(--ink-600);
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--ink-600) transparent;
    }
    #controls::-webkit-scrollbar { width: 4px; }
    #controls::-webkit-scrollbar-thumb { background: var(--ink-600); border-radius: 2px; }

    /* logo / wordmark */
    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--ink-600);
      margin-bottom: 4px;
    }
    .wordmark-title {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--teal);
    }
    .wordmark-sub {
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-400);
    }

    /* section header */
    .section-head {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--text-400);
      padding-top: 10px;
      padding-bottom: 3px;
      margin-top: 2px;
      border-top: 1px solid var(--ink-600);
    }

    /* individual parameter row */
    .param {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .param-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.7rem;
      color: var(--text-300);
    }
    .param-hint {
      font-size: 0.58rem;
      color: var(--text-400);
      font-style: italic;
    }
    .param-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
      min-width: 0;
      -webkit-appearance: none;
      height: 3px;
      background: var(--ink-600);
      border-radius: 2px;
      cursor: pointer;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--teal);
      border: 2px solid var(--ink-800);
      box-shadow: 0 0 0 1px var(--teal);
      cursor: pointer;
      transition: box-shadow 0.1s;
    }
    input[type="range"]:focus::-webkit-slider-thumb {
      box-shadow: 0 0 0 3px rgba(13,216,178,0.25);
    }
    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--teal);
      border: 2px solid var(--ink-800);
      cursor: pointer;
    }

    input[type="number"] {
      width: 62px;
      background: var(--ink-700);
      border: 1px solid var(--ink-600);
      border-radius: 3px;
      color: var(--teal);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 600;
      text-align: right;
      padding: 3px 6px;
      -moz-appearance: textfield;
      letter-spacing: 0.02em;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus {
      outline: none;
      border-color: var(--teal);
      background: var(--ink-800);
      box-shadow: 0 0 0 2px var(--teal-dim);
    }

    .param-unit {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--text-400);
      min-width: 24px;
      text-align: right;
    }

    /* simulate button */
    #simulate-btn {
      margin-top: 12px;
      background: var(--teal);
      color: var(--ink-950);
      border: none;
      border-radius: 4px;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.12s, box-shadow 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    #simulate-btn svg { flex-shrink: 0; }
    #simulate-btn:hover { opacity: 0.88; box-shadow: 0 0 18px rgba(13,216,178,0.3); }
    #simulate-btn:active { opacity: 0.75; }

    /* ─── Right panel ───────────────────────────────────────────── */
    #vis {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 12px 10px;
      gap: 8px;
      overflow: hidden;
      min-width: 0;
    }

    /* canvas wrappers — the "screens" */
    .screen {
      background: var(--canvas-bg);
      border: 1px solid var(--ink-600);
      border-radius: 6px;
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ─── Readout bar ───────────────────────────────────────────── */
    #readout {
      background: var(--ink-800);
      border: 1px solid var(--ink-600);
      border-radius: 6px;
      padding: 8px 0 6px;
      display: flex;
      flex-shrink: 0;
    }
    .reading {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 0 2px;
      border-right: 1px solid var(--ink-600);
    }
    .reading:last-child { border-right: none; }
    .reading-label {
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-400);
    }
    .reading-value {
      font-family: var(--mono);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-100);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .reading-value.pending {
      color: var(--text-400);
      font-size: 0.85rem;
      font-weight: 400;
    }
    .reading-unit {
      font-family: var(--mono);
      font-size: 0.52rem;
      color: var(--text-400);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
<div id="app">
  <aside id="controls">
    <div class="wordmark">
      <span class="wordmark-title">Ballflight</span>
      <span class="wordmark-sub">Physics Engine</span>
    </div>
    <!-- params injected by JS -->
    <button id="simulate-btn">
      <svg width="10" height="11" viewBox="0 0 10 11" fill="currentColor">
        <path d="M1.5 1.5l7 4-7 4V1.5z"/>
      </svg>
      Run Simulation
    </button>
  </aside>

  <div id="vis">
    <div class="screen" id="side-wrap"><canvas id="side-cv"></canvas></div>
    <div class="screen" id="top-wrap"><canvas id="top-cv"></canvas></div>
    <div id="readout">
      <div class="reading">
        <span class="reading-label">Carry</span>
        <span class="reading-value pending" id="rd-carry">—</span>
        <span class="reading-unit" id="ru-carry">m</span>
      </div>
      <div class="reading">
        <span class="reading-label">Max Height</span>
        <span class="reading-value pending" id="rd-height">—</span>
        <span class="reading-unit" id="ru-height">m</span>
      </div>
      <div class="reading">
        <span class="reading-label">Lateral</span>
        <span class="reading-value pending" id="rd-lat">—</span>
        <span class="reading-unit" id="ru-lat">m</span>
      </div>
      <div class="reading">
        <span class="reading-label">Flight Time</span>
        <span class="reading-value pending" id="rd-time">—</span>
        <span class="reading-unit" id="ru-time">s</span>
      </div>
      <div class="reading">
        <span class="reading-label">Land Speed</span>
        <span class="reading-value pending" id="rd-spd">—</span>
        <span class="reading-unit" id="ru-spd">m/s</span>
      </div>
      <div class="reading">
        <span class="reading-label">Spin Land</span>
        <span class="reading-value pending" id="rd-spin">—</span>
        <span class="reading-unit" id="ru-spin">rpm</span>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════════════════════════ */
const BALL = Object.freeze({
  d: 0.04267,
  m: 0.04593,
  r: 0.04267 / 2,
  A: Math.PI * (0.04267 / 2) ** 2,
});

const G        = 9.81;
const SPIN_TAU = 15.0;   // spin-decay time constant (s)
const K_PREC   = 0.05;   // gyroscopic precession coefficient
const DT       = 0.001;  // RK4 timestep (s)
const MAX_STEPS = 60000;

/* ════════════════════════════════════════════════════════════════
   ATMOSPHERE
════════════════════════════════════════════════════════════════ */

/** ISA air density with altitude + temperature correction (kg m⁻³). */
function airDensity(alt, tempC) {
  const T = tempC + 273.15;
  return 1.225 * (1 - 2.2557e-5 * alt) ** 5.2561 * (288.15 / T);
}

/** Dynamic viscosity via Sutherland's law (Pa·s). */
function airViscosity(tempC) {
  const T = tempC + 273.15;
  return 1.458e-6 * T ** 1.5 / (T + 110.4);
}

/* ════════════════════════════════════════════════════════════════
   AERODYNAMIC COEFFICIENTS
   Empirical fits for a dimpled golf ball.
   Bearman & Harvey (1976) + Smits & Smith (1994).
════════════════════════════════════════════════════════════════ */

/** Drag coefficient — piecewise Re-dependent + spin correction. */
function dragCoeff(Re, S) {
  let cd;
  if      (Re < 80000)  cd = 0.50;   // laminar; dimples ineffective
  else if (Re < 150000) cd = 0.25;   // transition — dimples trigger turbulence
  else                  cd = 0.24;   // fully turbulent boundary layer
  return cd + 0.005 * S;
}

/** Magnus lift coefficient — saturating model C_L = 0.54·S / (0.31+S). */
function liftCoeff(S) {
  return (S < 1e-9) ? 0 : 0.54 * S / (0.31 + S);
}

/* ════════════════════════════════════════════════════════════════
   9D STATE DERIVATIVES
   State: [x, y, z,  vx, vy, vz,  ωx, ωy, ωz]
   Coord: +X downrange, +Y right, +Z up
════════════════════════════════════════════════════════════════ */
function deriv(s, wind, rho, mu) {
  const [, , , vx, vy, vz, ox, oy, oz] = s;

  const vrx = vx - wind.x, vry = vy - wind.y, vrz = vz - wind.z;
  const vr2 = vrx*vrx + vry*vry + vrz*vrz;
  const vrm = Math.sqrt(vr2);
  const om  = Math.sqrt(ox*ox + oy*oy + oz*oz);

  let ax = 0, ay = 0, az = -G;

  if (vrm > 0.05) {
    const Re = rho * vrm * BALL.d / mu;
    const S  = (om > 0.05) ? om * BALL.r / vrm : 0;
    const qA = 0.5 * rho * vr2 * BALL.A;
    const iM = 1 / BALL.m;

    // ── Drag: −q·CD·A·v̂_rel
    const fD = qA * dragCoeff(Re, S) / vrm;
    ax -= fD * vrx * iM;
    ay -= fD * vry * iM;
    az -= fD * vrz * iM;

    // ── Magnus lift: q·CL·A·unit(ω × v_rel)
    if (om > 0.05) {
      const cx = oy*vrz - oz*vry;
      const cy = oz*vrx - ox*vrz;
      const cz = ox*vry - oy*vrx;
      const cm = Math.sqrt(cx*cx + cy*cy + cz*cz);
      if (cm > 1e-12) {
        const fM = qA * liftCoeff(S) / (cm * BALL.m);
        ax += fM * cx; ay += fM * cy; az += fM * cz;
      }
    }
  }

  // ── Spin decay: dω/dt = −ω/τ
  let dox = -ox / SPIN_TAU;
  let doy = -oy / SPIN_TAU;
  let doz = -oz / SPIN_TAU;

  // ── Gyroscopic precession: spin axis tracks velocity
  //    dω/dt_p = K·|ω|·(v̂ − (ω̂·v̂)·ω̂)
  const vm = Math.sqrt(vx*vx + vy*vy + vz*vz);
  if (vm > 0.05 && om > 0.05) {
    const vhx = vx/vm, vhy = vy/vm, vhz = vz/vm;
    const ohx = ox/om, ohy = oy/om, ohz = oz/om;
    const dt  = ohx*vhx + ohy*vhy + ohz*vhz;
    const kp  = K_PREC * om;
    dox += kp * (vhx - dt*ohx);
    doy += kp * (vhy - dt*ohy);
    doz += kp * (vhz - dt*ohz);
  }

  return [vx, vy, vz, ax, ay, az, dox, doy, doz];
}

/* ════════════════════════════════════════════════════════════════
   RK4 INTEGRATOR
════════════════════════════════════════════════════════════════ */
function rk4(s, wind, rho, mu) {
  const n  = s.length;
  const h  = DT;
  const add = (a, b) => { const r = new Float64Array(n); for (let i=0;i<n;i++) r[i]=a[i]+b[i]; return r; };
  const scl = (a, k) => { const r = new Float64Array(n); for (let i=0;i<n;i++) r[i]=a[i]*k; return r; };
  const k1 = deriv(s, wind, rho, mu);
  const k2 = deriv(add(s, scl(k1, h/2)), wind, rho, mu);
  const k3 = deriv(add(s, scl(k2, h/2)), wind, rho, mu);
  const k4 = deriv(add(s, scl(k3, h)),   wind, rho, mu);
  const o  = new Float64Array(n);
  for (let i=0; i<n; i++) o[i] = s[i] + (h/6)*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);
  return o;
}

/* ════════════════════════════════════════════════════════════════
   SIMULATION
════════════════════════════════════════════════════════════════ */
function buildState(p) {
  const R = Math.PI / 180;
  const th = p.launchAngle * R, ph = p.launchDir * R;
  const vx0 = p.ballSpeed * Math.cos(th) * Math.cos(ph);
  const vy0 = p.ballSpeed * Math.cos(th) * Math.sin(ph);
  const vz0 = p.ballSpeed * Math.sin(th);

  // Backspin → -Y axis (upward Magnus); sidespin → +Z (positive = fade)
  const wb = p.backspin * (2*Math.PI/60);
  const ws = p.sidespin * (2*Math.PI/60);
  const ti = p.spinTilt * R;
  const cT = Math.cos(ti), sT = Math.sin(ti);
  const oyB = -wb, ozB = ws;

  return new Float64Array([
    0, 0, 0,
    vx0, vy0, vz0,
    0,
    oyB*cT - ozB*sT,
    oyB*sT + ozB*cT,
  ]);
}

/** Met convention: wind direction = FROM where it blows, 0°=headwind. */
function buildWind(spd, dir) {
  const r = dir * (Math.PI/180);
  return { x: -spd*Math.cos(r), y: -spd*Math.sin(r), z: 0 };
}

function simulate(p) {
  let s    = buildState(p);
  const w  = buildWind(p.windSpeed, p.windDir);
  const rho = airDensity(p.altitude, p.temperature);
  const mu  = airViscosity(p.temperature);

  const traj = [Array.from(s)];
  let t=0, maxZ=0, step=0;

  while (step < MAX_STEPS) {
    s = rk4(s, w, rho, mu);
    t += DT; step++;
    if (s[2] > maxZ) maxZ = s[2];
    if (step % 10 === 0) traj.push(Array.from(s));
    if (s[2] < 0 && t > 0.15) break;
  }

  const last = traj[traj.length - 1];
  const om   = Math.sqrt(last[6]**2 + last[7]**2 + last[8]**2);
  return {
    traj,
    carry:       last[0],
    maxHeight:   maxZ,
    lateral:     last[1],
    flightTime:  t,
    landSpeed:   Math.sqrt(last[3]**2 + last[4]**2 + last[5]**2),
    spinAtLand:  om * 60 / (2*Math.PI),
  };
}

/* ════════════════════════════════════════════════════════════════
   RENDERER
════════════════════════════════════════════════════════════════ */

// Canvas drawing uses logical pixels; callers divide by dpr.
const P = { l:52, r:16, t:24, b:40 };  // padding in logical px

function w2c(wx, wz, x0, x1, z0, z1, W, H) {
  return [
    P.l + (wx-x0)/(x1-x0) * (W-P.l-P.r),
    (H-P.b) - (wz-z0)/(z1-z0) * (H-P.t-P.b),
  ];
}

function niceStep(range, n) {
  const raw = range/n, mag = 10**Math.floor(Math.log10(raw)), f = raw/mag;
  return (f<1.5?1:f<3.5?2:f<7.5?5:10) * mag;
}

function ranges(traj) {
  let xm=1, zm=1, ya=5;
  for (const s of traj) {
    if (s[0]>xm) xm=s[0];
    if (s[2]>zm) zm=s[2];
    if (Math.abs(s[1])>ya) ya=Math.abs(s[1]);
  }
  return {
    x0:0, x1: Math.ceil(xm/10)*10+10,
    z0:0, z1: Math.max(Math.ceil(zm/5)*5+5, 10),
    y0: -(Math.ceil(ya/5)*5+5),
    y1:   Math.ceil(ya/5)*5+5,
  };
}

function drawGrid(ctx, W, H, x0, x1, z0, z1, xLbl, zLbl, isTop) {
  const dw = W-P.l-P.r, dh = H-P.t-P.b;
  const xs = niceStep(x1-x0, 7), zs = niceStep(z1-z0, 5);

  ctx.save();

  // Radial vignette — gives the "screen" depth
  const vx = P.l+dw/2, vy = P.t+dh/2;
  const gr = ctx.createRadialGradient(vx,vy,0, vx,vy,Math.max(dw,dh)*0.7);
  gr.addColorStop(0, 'rgba(6,16,29,0)');
  gr.addColorStop(1, 'rgba(3,8,16,0.55)');
  ctx.fillStyle = gr;
  ctx.fillRect(P.l, P.t, dw, dh);

  // Grid lines
  ctx.strokeStyle = '#0e1f32';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 4]);

  ctx.font = `10px ${getComputedStyle(document.body).getPropertyValue('--mono') || 'monospace'}`;
  ctx.fillStyle = '#2a4060';

  ctx.textAlign = 'center';
  for (let xw=0; xw<=x1+0.01; xw+=xs) {
    const [cx] = w2c(xw, z0, x0, x1, z0, z1, W, H);
    ctx.beginPath(); ctx.moveTo(cx, P.t); ctx.lineTo(cx, H-P.b); ctx.stroke();
    ctx.fillText(xw.toFixed(0), cx, H-P.b+13);
  }
  ctx.textAlign = 'right';
  for (let zw=z0; zw<=z1+0.01; zw+=zs) {
    const [, cy] = w2c(x0, zw, x0, x1, z0, z1, W, H);
    ctx.beginPath(); ctx.moveTo(P.l, cy); ctx.lineTo(W-P.r, cy); ctx.stroke();
    ctx.fillText(zw.toFixed(0), P.l-5, cy+3);
  }
  ctx.setLineDash([]);

  // Reference line (ground / center)
  const [, cy0] = w2c(x0, 0, x0, x1, z0, z1, W, H);
  ctx.strokeStyle = '#1a6b50';
  ctx.lineWidth = isTop ? 1 : 1.5;
  if (isTop) ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(P.l, cy0); ctx.lineTo(W-P.r, cy0); ctx.stroke();
  ctx.setLineDash([]);

  // Axis frame
  ctx.strokeStyle = '#162d48';
  ctx.lineWidth = 1;
  ctx.strokeRect(P.l, P.t, dw, dh);

  // Axis labels
  ctx.fillStyle = '#2c4a68';
  ctx.font = '10px ' + (getComputedStyle(document.body).getPropertyValue('--sans')||'sans-serif');
  ctx.textAlign = 'center';
  ctx.fillText(xLbl, P.l+dw/2, H-P.b+28);

  ctx.save();
  ctx.translate(11, P.t+dh/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText(zLbl, 0, 0);
  ctx.restore();

  ctx.restore();
}

function drawTrajectory(ctx, traj, x0, x1, z0, z1, W, H, useY) {
  if (traj.length < 2) return;
  ctx.save();
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  const n = traj.length - 1;
  for (let i=1; i<=n; i++) {
    const t = i/n;
    // gold(50°) → amber(25°) → crimson(0°) in HSL
    const h = 50 - 50*t, l = 62 - 14*t;
    ctx.strokeStyle = `hsl(${h.toFixed(0)},90%,${l.toFixed(0)}%)`;
    const pz = useY ? traj[i-1][1] : traj[i-1][2];
    const cz = useY ? traj[i][1]   : traj[i][2];
    const [px,py] = w2c(traj[i-1][0], pz, x0, x1, z0, z1, W, H);
    const [qx,qy] = w2c(traj[i][0],   cz, x0, x1, z0, z1, W, H);
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(qx,qy); ctx.stroke();
  }
  ctx.restore();
}

function drawMarkers(ctx, traj, x0, x1, z0, z1, W, H, useY, showApex) {
  if (!traj.length) return;
  ctx.save();
  const last = traj[traj.length-1];

  // Launch
  const [lx,ly] = w2c(0, 0, x0, x1, z0, z1, W, H);
  ctx.fillStyle = '#0dd8b2';
  ctx.beginPath(); ctx.arc(lx, ly, 4, 0, 2*Math.PI); ctx.fill();

  // Apex (side view only)
  if (showApex) {
    let ai=0, az=0;
    for (let i=0; i<traj.length; i++) if (traj[i][2]>az) { az=traj[i][2]; ai=i; }
    const ap = traj[ai];
    const [ax,ay]   = w2c(ap[0], az, x0, x1, z0, z1, W, H);
    const [, gndY]  = w2c(ap[0], 0,  x0, x1, z0, z1, W, H);

    ctx.strokeStyle = 'rgba(248,196,58,0.35)';
    ctx.lineWidth = 1; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax,gndY); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#f8c43a';
    ctx.beginPath();
    ctx.moveTo(ax, ay-6); ctx.lineTo(ax+5, ay);
    ctx.lineTo(ax, ay+6); ctx.lineTo(ax-5, ay);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#f8c43a';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(az.toFixed(1)+'m', ax, ay-9);
  }

  // Landing
  const lz = useY ? last[1] : 0;
  const [dx,dy] = w2c(last[0], lz, x0, x1, z0, z1, W, H);
  ctx.strokeStyle = '#e04545';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(dx-5,dy-5); ctx.lineTo(dx+5,dy+5);
  ctx.moveTo(dx+5,dy-5); ctx.lineTo(dx-5,dy+5);
  ctx.stroke();

  ctx.fillStyle = '#e04545';
  ctx.font = '9px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(last[0].toFixed(0)+'m', dx+8, dy+4);

  ctx.restore();
}

function drawLabel(ctx, text) {
  ctx.save();
  ctx.fillStyle = 'rgba(13,216,178,0.08)';
  ctx.strokeStyle = 'rgba(13,216,178,0.18)';
  ctx.lineWidth = 1;
  // rounded rect
  const tw = 72, th = 17, tx = P.l+7, ty = P.t+6, r = 3;
  ctx.beginPath();
  ctx.moveTo(tx+r,ty); ctx.lineTo(tx+tw-r,ty); ctx.arcTo(tx+tw,ty,tx+tw,ty+r,r);
  ctx.lineTo(tx+tw,ty+th-r); ctx.arcTo(tx+tw,ty+th,tx+tw-r,ty+th,r);
  ctx.lineTo(tx+r,ty+th); ctx.arcTo(tx,ty+th,tx,ty+th-r,r);
  ctx.lineTo(tx,ty+r); ctx.arcTo(tx,ty,tx+r,ty,r); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#0dd8b2';
  ctx.font = '700 8.5px monospace';
  ctx.letterSpacing = '0.1em';
  ctx.textAlign = 'center';
  ctx.fillText(text, tx+tw/2, ty+12);
  ctx.restore();
}

function renderView(canvas, traj, isTop) {
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.width  / dpr;
  const H   = canvas.height / dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = '#06101d';
  ctx.fillRect(0, 0, W, H);

  if (!traj || traj.length < 2) return;

  const rng = ranges(traj);
  const z0  = isTop ? rng.y0 : rng.z0;
  const z1  = isTop ? rng.y1 : rng.z1;

  drawGrid(ctx, W, H, rng.x0, rng.x1, z0, z1,
    'Distance (m)', isTop ? 'Lateral (m)' : 'Height (m)', isTop);
  drawTrajectory(ctx, traj, rng.x0, rng.x1, z0, z1, W, H, isTop);
  drawMarkers(ctx, traj, rng.x0, rng.x1, z0, z1, W, H, isTop, !isTop);
  drawLabel(ctx, isTop ? 'TOP VIEW' : 'SIDE VIEW');
}

function resizeFit(canvas, wrap) {
  const dpr = window.devicePixelRatio || 1;
  const w   = Math.round(wrap.clientWidth  * dpr);
  const h   = Math.round(wrap.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
  }
}

/* ════════════════════════════════════════════════════════════════
   UI CONTROLS
════════════════════════════════════════════════════════════════ */
const PARAMS = [
  // [id, label, hint, unit, min, max, step, default]
  ['ballSpeed',   'Ball Speed',        '',               'm/s',  10,    100,  1,    70  ],
  ['launchAngle', 'Launch Angle',       '',               'deg',   0,     45,  0.5,  12  ],
  ['launchDir',   'Launch Direction',   '+ = right',      'deg', -30,     30,  0.5,   0  ],
  ['backspin',    'Backspin',           '',               'rpm',   0,   8000,  50, 3000  ],
  ['sidespin',    'Sidespin',           '+ = fade',       'rpm',-3000, 3000,  50,    0  ],
  ['spinTilt',    'Spin Axis Tilt',     '+ = fwd tilt',   'deg', -45,     45,  1,     0  ],
  ['windSpeed',   'Wind Speed',         '',               'm/s',   0,     20,  0.5,   0  ],
  ['windDir',     'Wind Dir (FROM)',    '0° = headwind',  'deg',   0,    360,  5,     0  ],
  ['altitude',    'Altitude',           '',               'm',     0,   3000, 10,     0  ],
  ['temperature', 'Temperature',        '',               '°C',  -10,     45,  1,    20  ],
];

const SECTIONS = { ballSpeed: 'Launch Conditions', windSpeed: 'Environment' };

function buildUI() {
  const panel = document.getElementById('controls');
  const btn   = document.getElementById('simulate-btn');

  for (const [id, label, hint, unit, min, max, step, def] of PARAMS) {
    if (SECTIONS[id]) {
      const sec = document.createElement('div');
      sec.className = 'section-head';
      sec.textContent = SECTIONS[id];
      panel.insertBefore(sec, btn);
    }

    const div = document.createElement('div');
    div.className = 'param';
    div.innerHTML = `
      <div class="param-label">
        ${label}${hint ? `<span class="param-hint">${hint}</span>` : ''}
      </div>
      <div class="param-row">
        <input type="range"  id="${id}-r" min="${min}" max="${max}" step="${step}" value="${def}">
        <input type="number" id="${id}"   min="${min}" max="${max}" step="${step}" value="${def}">
        <span class="param-unit">${unit}</span>
      </div>`;
    panel.insertBefore(div, btn);
  }
}

function wire() {
  for (const [id,,,, min, max] of PARAMS) {
    const n = document.getElementById(id);
    const r = document.getElementById(id+'-r');
    r.addEventListener('input', () => { n.value = r.value; });
    n.addEventListener('input', () => {
      const v = Math.max(min, Math.min(max, parseFloat(n.value)||0));
      n.value = v; r.value = v;
    });
  }
}

function getP() {
  const p = {};
  for (const [id] of PARAMS) p[id] = parseFloat(document.getElementById(id).value);
  return p;
}

function showResult(res) {
  const { carry, maxHeight, lateral, flightTime, landSpeed, spinAtLand } = res;
  const sign = lateral > 0 ? '+' : '';
  const set = (id, val) => {
    const el = document.getElementById(id);
    el.textContent = val;
    el.classList.remove('pending');
  };
  set('rd-carry',  carry.toFixed(1));
  set('rd-height', maxHeight.toFixed(1));
  set('rd-lat',    sign + lateral.toFixed(1));
  set('rd-time',   flightTime.toFixed(2));
  set('rd-spd',    landSpeed.toFixed(1));
  set('rd-spin',   spinAtLand.toFixed(0));
}

const sideCV = document.getElementById('side-cv');
const topCV  = document.getElementById('top-cv');
const sideW  = document.getElementById('side-wrap');
const topW   = document.getElementById('top-wrap');

let lastTraj = null;

function redraw() {
  resizeFit(sideCV, sideW); resizeFit(topCV, topW);
  renderView(sideCV, lastTraj, false);
  renderView(topCV,  lastTraj, true);
}

function run() {
  const res = simulate(getP());
  lastTraj = res.traj;
  redraw();
  showResult(res);
}

document.addEventListener('DOMContentLoaded', () => {
  buildUI(); wire();
  document.getElementById('simulate-btn').addEventListener('click', run);
  const ro = new ResizeObserver(redraw);
  ro.observe(sideW); ro.observe(topW);
  run();
});
</script>
</body>
